[project]
name = "cluster-client"
version = "0.1.0"
description = "Client for the NMS Cluster Manager and Cluster Orchestrator APIs"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
]

[project.scripts]
cluster_client = "cluster_client.cluster_client:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
