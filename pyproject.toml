[project]
name = "cluster-client"
version = "0.1.0"
description = "Command-line tool for managing NMS cluster operations through the Cluster Manager and Cluster Orchestrator APIs. Provides commands for querying cluster state, managing peer and HSA nodes, and performing critical maintenance operations including the repave command for zero-downtime cluster node replacement."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
]

[project.scripts]
cluster_client = "cluster_client.cluster_client:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.15",
]


[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
